# Aloha Directory — nginx in front of PHP-FPM. TLS is terminated by the load balancer / CDN in
# front of this container; set trusted_proxies in config.php accordingly.

# No client IP addresses in any access log (concept 8.4: list downloads log aggregate counts only).
log_format anonymous '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';

map $http_x_forwarded_proto $fwd_https { default ""; https on; }

server {
    listen 8080;
    server_name _;
    root /srv/www;
    index index.html;

    server_tokens off;
    client_max_body_size 128k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    charset utf-8;
    access_log /dev/stdout anonymous;

    # The signed lists: static files, no PHP, cacheable by any CDN; clients check signatures.
    location ^~ /lists/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=600, stale-if-error=2592000" always;
        default_type application/json;
        etag on;
        try_files $uri =404;
    }

    # Content-addressed images: immutable.
    location ^~ /media/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types { image/webp webp; }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Static website pages rendered by the list builder; everything else goes to the application.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=60" always;
        try_files $uri $uri/index.html @app;
    }

    location ~ /\. { deny all; }

    location @app {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS $fwd_https;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }
}
