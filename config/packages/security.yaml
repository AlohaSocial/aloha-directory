security:
    password_hashers:
        App\Entity\Curator:
            algorithm: auto

    providers:
        curators:
            entity:
                class: App\Entity\Curator
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false
        # The server API authenticates every request with an HTTP message signature (RFC 9421)
        # inside the controllers; it never uses sessions or cookies.
        api:
            pattern: ^/(api|lists|media|healthz|metrics)(/|$)
            stateless: true
            security: false
        console:
            pattern: ^/console
            lazy: true
            provider: curators
            user_checker: App\Security\CuratorChecker
            custom_authenticators:
                - App\Security\ConsoleAuthenticator
            entry_point: App\Security\ConsoleAuthenticator
            login_throttling:
                # Per IP, per account and IP, and per account (TOTP guessing from many IPs).
                limiter: App\Security\ConsoleLoginRateLimiter
            logout:
                path: console_logout
                enable_csrf: true
                csrf_token_id: logout
                target: console_login
                clear_site_data: ['cookies', 'storage']
                invalidate_session: true
        public:
            security: false

    access_control:
        - { path: ^/console/(login|invite/), roles: PUBLIC_ACCESS }
        - { path: ^/console/curators, roles: ROLE_ADMIN }
        - { path: ^/console, roles: ROLE_CURATOR }

when@test:
    security:
        password_hashers:
            App\Entity\Curator:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
